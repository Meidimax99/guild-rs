[package]
name = "gilde-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gilde"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
flate2 = "1.1.11"
gilde-esc = { version = "0.1.0", path = "../gilde-esc" }
gilde-formats = { version = "0.1.0", path = "../gilde-formats" }
gilde-net = { path = "../gilde-net" }
gilde-sim = { path = "../gilde-sim" }
glam.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
log.workspace = true
