[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
glam = "0.29"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
